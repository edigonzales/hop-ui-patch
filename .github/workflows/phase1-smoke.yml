name: Phase 1 smoke test

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  patch-manager:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v4

      - name: Checkout Apache Hop 2.19.0
        uses: actions/checkout@v4
        with:
          repository: apache/hop
          ref: 46436154ae1a1e940861d485559819360c2af86e
          path: hop

      - name: Apply Phase 1A-1C from clean checkout
        run: |
          set -o pipefail
          bash scripts/apply-phase1.sh "$GITHUB_WORKSPACE/hop" 2>&1 | tee /tmp/apply-clean.log

      - name: Check managed patch status
        run: |
          set -o pipefail
          bash scripts/status.sh "$GITHUB_WORKSPACE/hop" 2>&1 | tee /tmp/status-full.log

      - name: Save and validate resulting diff
        run: |
          git -C hop diff --check
          git -C hop diff --binary > /tmp/phase1-full.diff

      - name: Reapply Phase 1
        run: |
          set -o pipefail
          bash scripts/apply-phase1.sh "$GITHUB_WORKSPACE/hop" 2>&1 | tee /tmp/reapply.log

      - name: Verify repeated apply changed nothing
        run: |
          git -C hop diff --binary > /tmp/phase1-second.diff
          cmp /tmp/phase1-full.diff /tmp/phase1-second.diff

      - name: Create legacy Phase 1A-only checkout
        run: |
          set -o pipefail
          git -C hop reset --hard HEAD
          git -C hop clean -fd
          rm -f hop/.git/hop-ui-patch-state.json
          python3 scripts/apply_phase1a.py "$GITHUB_WORKSPACE/hop" 2>&1 | tee /tmp/apply-1a.log

      - name: Detect legacy Phase 1A-only state
        run: |
          set -o pipefail
          bash scripts/status.sh "$GITHUB_WORKSPACE/hop" 2>&1 | tee /tmp/status-1a.log

      - name: Upgrade legacy Phase 1A-only state
        run: |
          set -o pipefail
          bash scripts/apply-phase1.sh "$GITHUB_WORKSPACE/hop" 2>&1 | tee /tmp/upgrade-1a.log

      - name: Verify legacy upgrade converges to full Phase 1
        run: |
          git -C hop diff --check
          git -C hop diff --binary > /tmp/phase1-from-1a.diff
          cmp /tmp/phase1-full.diff /tmp/phase1-from-1a.diff

      - name: Reject unknown local changes
        run: |
          set -o pipefail
          printf '\nunknown local edit\n' >> hop/README.md
          if bash scripts/apply-phase1.sh "$GITHUB_WORKSPACE/hop" 2>&1 | tee /tmp/unknown-change.log; then
            echo "Patch manager unexpectedly accepted an unknown local change"
            exit 1
          fi

      - name: Upload patch-manager diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patch-manager-diagnostics
          path: |
            /tmp/apply-clean.log
            /tmp/status-full.log
            /tmp/reapply.log
            /tmp/apply-1a.log
            /tmp/status-1a.log
            /tmp/upgrade-1a.log
            /tmp/unknown-change.log

  build:
    needs: patch-manager
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v4

      - name: Checkout Apache Hop 2.19.0
        uses: actions/checkout@v4
        with:
          repository: apache/hop
          ref: 46436154ae1a1e940861d485559819360c2af86e
          path: hop

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Apply Phase 1A-1C
        run: bash scripts/apply-phase1.sh "$GITHUB_WORKSPACE/hop"

      - name: Build affected modules
        working-directory: hop
        # hop-engine has a test-scope dependency on hop-core's tests JAR.
        # The attached tests JAR is created in Maven's package phase, not compile.
        run: ./mvnw -pl ui,engine -am -DskipTests package
