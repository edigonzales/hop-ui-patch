name: UI patch smoke test

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  patch-manager:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v4

      - name: Checkout Apache Hop 2.19.0
        uses: actions/checkout@v4
        with:
          repository: apache/hop
          ref: 46436154ae1a1e940861d485559819360c2af86e
          path: hop

      - name: Apply through Phase 4 from clean checkout
        run: |
          set -o pipefail
          bash scripts/apply-phase4.sh "$GITHUB_WORKSPACE/hop" 2>&1 | tee /tmp/apply-clean.log

      - name: Check managed patch status
        run: |
          set -o pipefail
          bash scripts/status.sh "$GITHUB_WORKSPACE/hop" 2>&1 | tee /tmp/status-full.log

      - name: Save and validate current full diff
        run: |
          git -C hop diff --check
          git -C hop diff --binary > /tmp/current-full.diff

      - name: Reapply through Phase 4
        run: |
          set -o pipefail
          bash scripts/apply-phase4.sh "$GITHUB_WORKSPACE/hop" 2>&1 | tee /tmp/reapply.log

      - name: Verify repeated apply changed nothing
        run: |
          git -C hop diff --binary > /tmp/current-second.diff
          cmp /tmp/current-full.diff /tmp/current-second.diff

      - name: Upgrade from complete Phase 1 checkout
        run: |
          set -o pipefail
          git -C hop reset --hard HEAD
          git -C hop clean -fd
          rm -f hop/.git/hop-ui-patch-state.json
          bash scripts/apply-phase1.sh "$GITHUB_WORKSPACE/hop" 2>&1 | tee /tmp/apply-phase1.log
          bash scripts/apply-phase4.sh "$GITHUB_WORKSPACE/hop" 2>&1 | tee /tmp/upgrade-phase1.log
          git -C hop diff --check
          git -C hop diff --binary > /tmp/from-phase1.diff
          cmp /tmp/current-full.diff /tmp/from-phase1.diff

      - name: Create legacy Phase 3 state file
        run: |
          set -o pipefail
          git -C hop reset --hard HEAD
          git -C hop clean -fd
          rm -f hop/.git/hop-ui-patch-state.json
          bash scripts/apply-phase3.sh "$GITHUB_WORKSPACE/hop" 2>&1 | tee /tmp/apply-phase3.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          state_path = Path("hop/.git/hop-ui-patch-state.json")
          state = json.loads(state_path.read_text())
          state["phases"].pop("4", None)
          for path in (
              "engine/src/main/java/org/apache/hop/core/gui/BasePainter.java",
              "engine/src/main/java/org/apache/hop/pipeline/PipelinePainter.java",
              "engine/src/main/java/org/apache/hop/workflow/WorkflowPainter.java",
          ):
              state["files"].pop(path, None)
          state_path.write_text(json.dumps(state, indent=2, sort_keys=True) + "\n")
          PY

      - name: Upgrade legacy Phase 3 state to Phase 4
        run: |
          set -o pipefail
          bash scripts/status.sh "$GITHUB_WORKSPACE/hop" 2>&1 | tee /tmp/status-legacy-phase3.log
          bash scripts/apply-phase4.sh "$GITHUB_WORKSPACE/hop" 2>&1 | tee /tmp/upgrade-phase3.log
          git -C hop diff --check
          git -C hop diff --binary > /tmp/from-phase3.diff
          cmp /tmp/current-full.diff /tmp/from-phase3.diff

      - name: Reject unknown local changes
        run: |
          set -o pipefail
          printf '\nunknown local edit\n' >> hop/README.md
          if bash scripts/apply-phase4.sh "$GITHUB_WORKSPACE/hop" 2>&1 | tee /tmp/unknown-change.log; then
            echo "Patch manager unexpectedly accepted an unknown local change"
            exit 1
          fi

      - name: Upload patch-manager diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patch-manager-diagnostics
          path: |
            /tmp/apply-clean.log
            /tmp/status-full.log
            /tmp/reapply.log
            /tmp/apply-phase1.log
            /tmp/upgrade-phase1.log
            /tmp/apply-phase3.log
            /tmp/status-legacy-phase3.log
            /tmp/upgrade-phase3.log
            /tmp/unknown-change.log

  build:
    needs: patch-manager
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v4

      - name: Checkout Apache Hop 2.19.0
        uses: actions/checkout@v4
        with:
          repository: apache/hop
          ref: 46436154ae1a1e940861d485559819360c2af86e
          path: hop

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Apply through Phase 4
        run: bash scripts/apply-phase4.sh "$GITHUB_WORKSPACE/hop"

      - name: Build affected modules
        working-directory: hop
        # hop-engine has a test-scope dependency on hop-core's tests JAR.
        # The attached tests JAR is created in Maven's package phase, not compile.
        run: ./mvnw -pl ui,engine -am -DskipTests package
