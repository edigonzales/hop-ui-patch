name: UI patch smoke test

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  patch-manager:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v4

      - name: Checkout Apache Hop 2.19.0
        uses: actions/checkout@v4
        with:
          repository: apache/hop
          ref: 46436154ae1a1e940861d485559819360c2af86e
          path: hop

      - name: Apply all UI phases from clean checkout
        run: |
          set -o pipefail
          bash scripts/apply-ui-patch.sh "$GITHUB_WORKSPACE/hop" 2>&1 | tee /tmp/apply-clean.log

      - name: Check managed patch status
        run: |
          set -o pipefail
          bash scripts/status.sh "$GITHUB_WORKSPACE/hop" 2>&1 | tee /tmp/status-full.log

      - name: Save and validate resulting diff
        run: |
          git -C hop diff --check
          git -C hop diff --binary > /tmp/ui-full.diff

      - name: Reapply all UI phases
        run: |
          set -o pipefail
          bash scripts/apply-ui-patch.sh "$GITHUB_WORKSPACE/hop" 2>&1 | tee /tmp/reapply.log

      - name: Verify repeated apply changed nothing
        run: |
          git -C hop diff --binary > /tmp/ui-second.diff
          cmp /tmp/ui-full.diff /tmp/ui-second.diff

      - name: Create complete Phase 1 checkout
        run: |
          set -o pipefail
          git -C hop reset --hard HEAD
          git -C hop clean -fd
          rm -f hop/.git/hop-ui-patch-state.json
          bash scripts/apply-phase1.sh "$GITHUB_WORKSPACE/hop" 2>&1 | tee /tmp/apply-phase1.log

      - name: Detect Phase 1 with Phase 2 missing
        run: |
          set -o pipefail
          bash scripts/status.sh "$GITHUB_WORKSPACE/hop" 2>&1 | tee /tmp/status-phase1.log
          grep -q "2 Shared dialogs/forms.*missing" /tmp/status-phase1.log

      - name: Upgrade Phase 1 to latest UI patch
        run: |
          set -o pipefail
          bash scripts/apply-ui-patch.sh "$GITHUB_WORKSPACE/hop" 2>&1 | tee /tmp/upgrade-phase1.log

      - name: Verify Phase 1 upgrade converges
        run: |
          git -C hop diff --check
          git -C hop diff --binary > /tmp/ui-from-phase1.diff
          cmp /tmp/ui-full.diff /tmp/ui-from-phase1.diff

      - name: Create legacy state-v1 Phase 1 checkout
        run: |
          set -o pipefail
          git -C hop reset --hard HEAD
          git -C hop clean -fd
          rm -f hop/.git/hop-ui-patch-state.json
          bash scripts/apply-phase1.sh "$GITHUB_WORKSPACE/hop"
          python3 - <<'PY'
          import json
          from pathlib import Path

          state_path = Path("hop/.git/hop-ui-patch-state.json")
          state = json.loads(state_path.read_text())
          state["version"] = 1
          state["phases"] = {key: state["phases"][key] for key in ("1A", "1B", "1C")}
          legacy_paths = {
              "ui/src/main/java/org/apache/hop/ui/core/gui/HopUiTheme.java",
              "ui/src/main/java/org/apache/hop/ui/core/gui/GuiResource.java",
              "ui/src/main/java/org/apache/hop/ui/core/PropsUi.java",
              "engine/src/main/java/org/apache/hop/core/gui/CanvasColorPalette.java",
              "ui/src/main/java/org/apache/hop/ui/hopgui/HopGui.java",
              "ui/src/main/java/org/apache/hop/ui/core/gui/GuiToolbarWidgets.java",
          }
          state["files"] = {key: value for key, value in state["files"].items() if key in legacy_paths}
          state_path.write_text(json.dumps(state, indent=2, sort_keys=True) + "\n")
          PY

      - name: Upgrade legacy state-v1 checkout
        run: |
          set -o pipefail
          bash scripts/apply-ui-patch.sh "$GITHUB_WORKSPACE/hop" 2>&1 | tee /tmp/upgrade-state-v1.log

      - name: Verify state-v1 upgrade converges
        run: |
          git -C hop diff --check
          git -C hop diff --binary > /tmp/ui-from-state-v1.diff
          cmp /tmp/ui-full.diff /tmp/ui-from-state-v1.diff

      - name: Reject unknown local changes
        run: |
          set -o pipefail
          printf '\nunknown local edit\n' >> hop/README.md
          if bash scripts/apply-ui-patch.sh "$GITHUB_WORKSPACE/hop" 2>&1 | tee /tmp/unknown-change.log; then
            echo "Patch manager unexpectedly accepted an unknown local change"
            exit 1
          fi

      - name: Upload patch-manager diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patch-manager-diagnostics
          path: |
            /tmp/apply-clean.log
            /tmp/status-full.log
            /tmp/reapply.log
            /tmp/apply-phase1.log
            /tmp/status-phase1.log
            /tmp/upgrade-phase1.log
            /tmp/upgrade-state-v1.log
            /tmp/unknown-change.log

  build:
    needs: patch-manager
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v4

      - name: Checkout Apache Hop 2.19.0
        uses: actions/checkout@v4
        with:
          repository: apache/hop
          ref: 46436154ae1a1e940861d485559819360c2af86e
          path: hop

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Apply all UI phases
        run: bash scripts/apply-ui-patch.sh "$GITHUB_WORKSPACE/hop"

      - name: Build affected modules
        working-directory: hop
        # hop-engine has a test-scope dependency on hop-core's tests JAR.
        # The attached tests JAR is created in Maven's package phase, not compile.
        run: ./mvnw -pl ui,engine -am -DskipTests package
